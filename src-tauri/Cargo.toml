[package]
name = "landau-bridge"
version = "0.1.0"
description = "Barezpakhsh invoices onto a Landau shelf"
edition = "2021"
rust-version = "1.80"
default-run = "landau-bridge"

[lib]
name = "landau_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "landau-bridge"
path = "src/main.rs"

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"
required-features = ["live"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "gzip"] }
scraper = "0.27"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
regex = "1"
strsim = "0.11"
async-trait = "0.1"
chrono = "0.4"
url = "2"
csv = { version = "1", optional = true }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[features]
default = []
live = ["dep:csv"]
