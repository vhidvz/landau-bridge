# The gates every change passes before it reaches main: version mirrors, the scripts' own tests,
# the UI's tests, types and static build, and the Rust core's format, lints and tests.
# Third-party actions are pinned to a full commit SHA; the tag beside each is for the reader.
name: ci

on:
  push:
  pull_request:
  workflow_call: # release.yml runs the same gates before it builds anything

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when release.yml calls this, so the two never cancel each other
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Version mirrors
        run: node scripts/release.mjs --check
      - name: Script tests
        run: node --test 'scripts/*.spec.mjs'
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm generate
      - name: Rust core
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --features live -- -D warnings
          cargo test --locked
